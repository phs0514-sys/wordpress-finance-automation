name: Daily finance blog report

on:
  # 06:00 KST is 21:00 UTC on the previous day.
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
      OPENAI_RESEARCH_REASONING: medium
      OPENAI_WRITING_MODEL: gpt-5.6-terra
      OPENAI_WRITING_REASONING: medium
      PUBLISH_MODE: publish
      QUALITY_THRESHOLD: "90"
      MAX_REVISIONS: "4"
      WP_US_URL: ${{ secrets.WP_US_URL }}
      WP_US_SITE_REF: ${{ secrets.WP_US_SITE_REF }}
      WP_US_MODE: wpcom
      WP_US_USERNAME: ${{ secrets.WP_US_USERNAME }}
      WP_US_APPLICATION_PASSWORD: ${{ secrets.WP_US_APPLICATION_PASSWORD }}
      WP_US_CLIENT_ID: ${{ secrets.WP_US_CLIENT_ID }}
      WP_US_CLIENT_SECRET: ${{ secrets.WP_US_CLIENT_SECRET }}
      WP_US_ACCESS_TOKEN: ${{ secrets.WP_US_ACCESS_TOKEN }}
      WP_JP_URL: ${{ secrets.WP_JP_URL }}
      WP_JP_SITE_REF: ${{ secrets.WP_JP_SITE_REF }}
      WP_JP_MODE: wpcom
      WP_KR_URL: ${{ secrets.WP_KR_URL }}
      WP_KR_SITE_REF: ${{ secrets.WP_KR_SITE_REF }}
      WP_KR_MODE: wpcom
    steps:
      - name: Check out automation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate report
        run: |
          mkdir -p reports
          REPORT_DATE=$(TZ=Asia/Seoul date -d "yesterday" +%F)
          python daily_report.py > "reports/${REPORT_DATE}.md"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Add daily finance blog report"
            git push
          fi

