name: Daily finance blog report

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report_existing:
    name: Report existing sites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WP_US_URL: ${{ secrets.WP_US_URL }}
      WP_US_SITE_REF: ${{ secrets.WP_US_SITE_REF }}
      WP_US_MODE: wpcom
      WP_US_USERNAME: ${{ secrets.WP_US_USERNAME }}
      WP_US_APPLICATION_PASSWORD: ${{ secrets.WP_US_APPLICATION_PASSWORD }}
      WP_US_CLIENT_ID: ${{ secrets.WP_US_CLIENT_ID }}
      WP_US_CLIENT_SECRET: ${{ secrets.WP_US_CLIENT_SECRET }}
      WP_US_ACCESS_TOKEN: ${{ secrets.WP_US_ACCESS_TOKEN }}
      WP_JP_URL: ${{ secrets.WP_JP_URL }}
      WP_JP_SITE_REF: ${{ secrets.WP_JP_SITE_REF }}
      WP_JP_MODE: wpcom
      WP_KR_URL: ${{ secrets.WP_KR_URL }}
      WP_KR_SITE_REF: ${{ secrets.WP_KR_SITE_REF }}
      WP_KR_MODE: wpcom
      GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
      GSC_US_TOKEN: ${{ secrets.GSC_US_TOKEN }}
      GSC_JP_TOKEN: ${{ secrets.GSC_JP_TOKEN }}
      GSC_KR_TOKEN: ${{ secrets.GSC_KR_TOKEN }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
    steps:
      - name: Check out automation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate existing-site report
        run: |
          mkdir -p reports
          REPORT_DATE=$(TZ=Asia/Seoul date -d "yesterday" +%F)
          python daily_report.py > "reports/$REPORT_DATE-existing.md"
      - name: Commit existing-site report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if [ -f data/article_history.json ]; then git add data/article_history.json; fi
          if [ -f data/publish_control.json ]; then git add data/publish_control.json; fi
          if git diff --cached --quiet; then
            echo "No existing-site report changes to commit"
          else
            git commit -m "Add existing site daily report"
            git push
          fi

  report_new:
    name: Report new sites
    needs: report_existing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WP_US_URL: https://uscurrentbrief.wordpress.com
      WP_US_SITE_REF: uscurrentbrief.wordpress.com
      WP_US_MODE: wpcom
      WP_US_USERNAME: ${{ secrets.WP_US_USERNAME }}
      WP_US_APPLICATION_PASSWORD: ${{ secrets.WP_US_APPLICATION_PASSWORD }}
      WP_US_CLIENT_ID: ${{ secrets.WP_US_CLIENT_ID }}
      WP_US_CLIENT_SECRET: ${{ secrets.WP_US_CLIENT_SECRET }}
      WP_US_ACCESS_TOKEN: ${{ secrets.WP_US_ACCESS_TOKEN }}
      WP_JP_URL: https://jpdailybrief.wordpress.com
      WP_JP_SITE_REF: jpdailybrief.wordpress.com
      WP_JP_MODE: wpcom
      WP_KR_URL: https://krdailybrief.wordpress.com
      WP_KR_SITE_REF: krdailybrief.wordpress.com
      WP_KR_MODE: wpcom
      GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
      GSC_US_TOKEN: ${{ secrets.GSC_US_TOKEN }}
      GSC_JP_TOKEN: ${{ secrets.GSC_JP_TOKEN }}
      GSC_KR_TOKEN: ${{ secrets.GSC_KR_TOKEN }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
    steps:
      - name: Check out automation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate new-site report
        run: |
          mkdir -p reports
          REPORT_DATE=$(TZ=Asia/Seoul date -d "yesterday" +%F)
          python daily_report.py > "reports/$REPORT_DATE-new.md"
      - name: Commit new-site report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if [ -f data/article_history.json ]; then git add data/article_history.json; fi
          if [ -f data/publish_control.json ]; then git add data/publish_control.json; fi
          if git diff --cached --quiet; then
            echo "No new-site report changes to commit"
          else
            git commit -m "Add new site daily report"
            git push
          fi
