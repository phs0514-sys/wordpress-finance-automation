name: Ensure four daily publications for existing sites

on:
  # GitHub cron uses UTC. These runs occur after the final local slot:
  # US 20:30/21:30 local (DST variants) and JP/KR 21:30 local.
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 1 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale to backfill (all, us, jp, or kr)"
        required: true
        default: "all"

permissions:
  contents: write

concurrency:
  group: finance-publish
  cancel-in-progress: false

jobs:
  daily_backfill:
    name: Backfill existing sites to four daily posts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
      OPENAI_RESEARCH_REASONING: medium
      OPENAI_WRITING_MODEL: gpt-5.6-terra
      OPENAI_WRITING_REASONING: medium
      PUBLISH_MODE: publish
      QUALITY_THRESHOLD: "80"
      MAX_REVISIONS: "4"
      PUBLISH_HEALTH_GATE: "1"
      PUBLISH_FORCE_RESUME: ${{ secrets.PUBLISH_FORCE_RESUME }}
      FINAL_FACT_REVIEW: "1"
      PUBLISH_SLOT_TOLERANCE_MINUTES: "30"
      LEGACY_DAILY_TARGET: "4"
      WP_US_URL: ${{ secrets.WP_US_URL }}
      WP_US_SITE_REF: ${{ secrets.WP_US_SITE_REF }}
      WP_US_MODE: wpcom
      WP_US_USERNAME: ${{ secrets.WP_US_USERNAME }}
      WP_US_APPLICATION_PASSWORD: ${{ secrets.WP_US_APPLICATION_PASSWORD }}
      WP_US_CLIENT_ID: ${{ secrets.WP_US_CLIENT_ID }}
      WP_US_CLIENT_SECRET: ${{ secrets.WP_US_CLIENT_SECRET }}
      WP_US_ACCESS_TOKEN: ${{ secrets.WP_US_ACCESS_TOKEN }}
      WP_JP_URL: ${{ secrets.WP_JP_URL }}
      WP_JP_SITE_REF: ${{ secrets.WP_JP_SITE_REF }}
      WP_JP_MODE: wpcom
      WP_JP_USERNAME: ${{ secrets.WP_JP_USERNAME }}
      WP_JP_APPLICATION_PASSWORD: ${{ secrets.WP_JP_APPLICATION_PASSWORD }}
      WP_JP_CLIENT_ID: ${{ secrets.WP_JP_CLIENT_ID }}
      WP_JP_CLIENT_SECRET: ${{ secrets.WP_JP_CLIENT_SECRET }}
      WP_JP_ACCESS_TOKEN: ${{ secrets.WP_JP_ACCESS_TOKEN }}
      WP_KR_URL: ${{ secrets.WP_KR_URL }}
      WP_KR_SITE_REF: ${{ secrets.WP_KR_SITE_REF }}
      WP_KR_MODE: wpcom
      WP_KR_USERNAME: ${{ secrets.WP_KR_USERNAME }}
      WP_KR_APPLICATION_PASSWORD: ${{ secrets.WP_KR_APPLICATION_PASSWORD }}
      WP_KR_CLIENT_ID: ${{ secrets.WP_KR_CLIENT_ID }}
      WP_KR_CLIENT_SECRET: ${{ secrets.WP_KR_CLIENT_SECRET }}
      WP_KR_ACCESS_TOKEN: ${{ secrets.WP_KR_ACCESS_TOKEN }}
      GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
      GSC_US_TOKEN: ${{ secrets.GSC_US_TOKEN }}
      GSC_JP_TOKEN: ${{ secrets.GSC_JP_TOKEN }}
      GSC_KR_TOKEN: ${{ secrets.GSC_KR_TOKEN }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
    steps:
      - name: Check out automation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure existing sites reach daily quota
        run: python github_runner.py --ensure-daily-quota --target-daily-posts "$LEGACY_DAILY_TARGET" --locale "${{ inputs.locale || 'all' }}"

      - name: Commit existing-site backfill state
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/article_history.json data/article_versions.json data/source_usage.json data/publish_control.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No existing-site backfill state changes to commit"
          else
            git commit -m "Record existing-site daily backfill"
            git push
          fi
