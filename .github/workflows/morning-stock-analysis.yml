name: Publish local 04:00 stock analysis

on:
  # GitHub cron is UTC; the runner gates each locale by its real local clock.
  # The 15-minute cadence provides a retry window while the state file prevents duplicates.
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale to run (all, us, jp, or kr)"
        required: true
        default: "all"

permissions:
  contents: write

concurrency:
  group: morning-stock-analysis
  cancel-in-progress: false

jobs:
  morning_stock_analysis:
    name: Local 04:00 stock analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
      OPENAI_RESEARCH_REASONING: medium
      OPENAI_WRITING_MODEL: gpt-5.6-terra
      OPENAI_WRITING_REASONING: medium
      PUBLISH_MODE: publish
      QUALITY_THRESHOLD: "85"
      MAX_REVISIONS: "4"
      PUBLISH_HEALTH_GATE: "1"
      FINAL_FACT_REVIEW: "1"
      MORNING_SLOT_TOLERANCE_MINUTES: "45"
      PUBLISH_FORCE_RESUME: "1"
      WP_US_URL: ${{ secrets.WP_US_URL }}
      WP_US_SITE_REF: ${{ secrets.WP_US_SITE_REF }}
      WP_US_MODE: wpcom
      WP_US_USERNAME: ${{ secrets.WP_US_USERNAME }}
      WP_US_APPLICATION_PASSWORD: ${{ secrets.WP_US_APPLICATION_PASSWORD }}
      WP_US_CLIENT_ID: ${{ secrets.WP_US_CLIENT_ID }}
      WP_US_CLIENT_SECRET: ${{ secrets.WP_US_CLIENT_SECRET }}
      WP_US_ACCESS_TOKEN: ${{ secrets.WP_US_ACCESS_TOKEN }}
      WP_JP_URL: ${{ secrets.WP_JP_URL }}
      WP_JP_SITE_REF: ${{ secrets.WP_JP_SITE_REF }}
      WP_JP_MODE: wpcom
      WP_KR_URL: ${{ secrets.WP_KR_URL }}
      WP_KR_SITE_REF: ${{ secrets.WP_KR_SITE_REF }}
      WP_KR_MODE: wpcom
      GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
      GSC_US_TOKEN: ${{ secrets.GSC_US_TOKEN }}
      GSC_JP_TOKEN: ${{ secrets.GSC_JP_TOKEN }}
      GSC_KR_TOKEN: ${{ secrets.GSC_KR_TOKEN }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
    steps:
      - name: Check out automation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run local 04:00 analysis and publication
        run: python morning_stock_runner.py --locale ${{ inputs.locale || 'all' }}
      - name: Commit morning run state and article metadata
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/morning_stock_runs.json data/article_history.json data/article_versions.json data/source_usage.json data/publish_control.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No morning run changes to commit"
          else
            git commit -m "Record local 04:00 stock analysis run"
            git push
          fi
