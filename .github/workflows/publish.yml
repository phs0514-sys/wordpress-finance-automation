name: Publish finance articles

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "50 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      slot_index:
        description: "KST slot: 0=08:00, 1=11:50, 2=16:00, 3=20:00"
        required: true
        default: "0"
      locale:
        description: "Locale to publish (all, us, jp, or kr)"
        required: true
        default: "all"

permissions:
  contents: write

concurrency:
  group: finance-publish
  cancel-in-progress: false

jobs:
  publish_existing:
    name: Publish existing sites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
      OPENAI_RESEARCH_REASONING: medium
      OPENAI_WRITING_MODEL: gpt-5.6-terra
      OPENAI_WRITING_REASONING: medium
      PUBLISH_MODE: publish
      QUALITY_THRESHOLD: "85"
      MAX_REVISIONS: "4"
      PUBLISH_HEALTH_GATE: "1"
      PUBLISH_FORCE_RESUME: ${{ secrets.PUBLISH_FORCE_RESUME }}
      FINAL_FACT_REVIEW: "1"
      WP_US_URL: ${{ secrets.WP_US_URL }}
      WP_US_SITE_REF: ${{ secrets.WP_US_SITE_REF }}
      WP_US_MODE: wpcom
      WP_US_USERNAME: ${{ secrets.WP_US_USERNAME }}
      WP_US_APPLICATION_PASSWORD: ${{ secrets.WP_US_APPLICATION_PASSWORD }}
      WP_US_CLIENT_ID: ${{ secrets.WP_US_CLIENT_ID }}
      WP_US_CLIENT_SECRET: ${{ secrets.WP_US_CLIENT_SECRET }}
      WP_US_ACCESS_TOKEN: ${{ secrets.WP_US_ACCESS_TOKEN }}
      WP_JP_URL: ${{ secrets.WP_JP_URL }}
      WP_JP_SITE_REF: ${{ secrets.WP_JP_SITE_REF }}
      WP_JP_MODE: wpcom
      WP_KR_URL: ${{ secrets.WP_KR_URL }}
      WP_KR_SITE_REF: ${{ secrets.WP_KR_SITE_REF }}
      WP_KR_MODE: wpcom
      GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
      GSC_US_TOKEN: ${{ secrets.GSC_US_TOKEN }}
      GSC_JP_TOKEN: ${{ secrets.GSC_JP_TOKEN }}
      GSC_KR_TOKEN: ${{ secrets.GSC_KR_TOKEN }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
    steps:
      - name: Check out automation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish existing locales
        run: python github_runner.py --slot-index "${{ inputs.slot_index || 0 }}" --locale "${{ inputs.locale || 'all' }}"
      - name: Commit existing site history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/article_history.json data/article_versions.json data/source_usage.json data/publish_control.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No existing-site history changes to commit"
          else
            git commit -m "Record existing site publication metadata"
            git push
          fi

  publish_new:
    name: Publish new sites
    needs: publish_existing
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
      OPENAI_RESEARCH_REASONING: medium
      OPENAI_WRITING_MODEL: gpt-5.6-terra
      OPENAI_WRITING_REASONING: medium
      PUBLISH_MODE: publish
      QUALITY_THRESHOLD: "85"
      MAX_REVISIONS: "4"
      PUBLISH_HEALTH_GATE: "1"
      PUBLISH_FORCE_RESUME: ${{ secrets.PUBLISH_FORCE_RESUME }}
      FINAL_FACT_REVIEW: "1"
      WP_US_URL: https://uscurrentbrief.wordpress.com
      WP_US_SITE_REF: uscurrentbrief.wordpress.com
      WP_US_MODE: wpcom
      WP_US_USERNAME: ${{ secrets.WP_US_USERNAME }}
      WP_US_APPLICATION_PASSWORD: ${{ secrets.WP_US_APPLICATION_PASSWORD }}
      WP_US_CLIENT_ID: ${{ secrets.WP_US_CLIENT_ID }}
      WP_US_CLIENT_SECRET: ${{ secrets.WP_US_CLIENT_SECRET }}
      WP_US_ACCESS_TOKEN: ${{ secrets.WP_US_ACCESS_TOKEN }}
      WP_JP_URL: https://jpdailybrief.wordpress.com
      WP_JP_SITE_REF: jpdailybrief.wordpress.com
      WP_JP_MODE: wpcom
      WP_KR_URL: https://krdailybrief.wordpress.com
      WP_KR_SITE_REF: krdailybrief.wordpress.com
      WP_KR_MODE: wpcom
      GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
      GSC_US_TOKEN: ${{ secrets.GSC_US_TOKEN }}
      GSC_JP_TOKEN: ${{ secrets.GSC_JP_TOKEN }}
      GSC_KR_TOKEN: ${{ secrets.GSC_KR_TOKEN }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
    steps:
      - name: Check out automation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish new locales
        run: python github_runner.py --slot-index "${{ inputs.slot_index || 0 }}" --locale "${{ inputs.locale || 'all' }}"
      - name: Commit new site history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/article_history.json data/article_versions.json data/source_usage.json data/publish_control.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No new-site history changes to commit"
          else
            git commit -m "Record new site publication metadata"
            git push
          fi
